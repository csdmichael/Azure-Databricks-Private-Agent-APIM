name: Deploy Agents UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/deploy-ui.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-databricks-agents-ui
  cancel-in-progress: true

env:
  API_BASE_URL: https://databricks-agents-api-my.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Point the build at the deployed API
        working-directory: ui
        run: |
          sed -i "s|apiBaseUrl: '.*'|apiBaseUrl: '${API_BASE_URL}'|" src/environments/environment.prod.ts
          cat src/environments/environment.prod.ts

      - name: Build
        working-directory: ui
        run: npm run build -- --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ui/www
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test the deployed site
        run: |
          url="https://${{ vars.UI_HOSTNAME || 'green-forest-06861ca1e.7.azurestaticapps.net' }}"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 30 "$url" || true)
            if [ "$code" = "200" ]; then
              grep -qi "databricks" /tmp/index.html && echo "UI is serving" && exit 0
              echo "200 but unexpected content"; exit 1
            fi
            echo "attempt $attempt: HTTP $code"; sleep 15
          done
          echo "UI did not respond in time"; exit 1
