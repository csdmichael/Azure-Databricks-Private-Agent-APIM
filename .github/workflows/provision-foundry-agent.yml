name: Provision Foundry Databricks Agents

on:
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: "Query Databricks and generate a PowerPoint smoke-test artifact"
        type: boolean
        default: true

# Archived component. Manual dispatch only - the push trigger was removed when
# foundry moved under "old mcaps".

permissions:
  id-token: write
  contents: read

concurrency:
  group: provision-foundry-databricks-agent
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: m365-myaacoub
  FOUNDRY_ACCOUNT_NAME: 002-ai-poc-private
  FOUNDRY_PROJECT_NAME: proj-default
  FOUNDRY_PROJECT_ENDPOINT: https://002-ai-poc-private.services.ai.azure.com/api/projects/proj-default
  FOUNDRY_AGENT_NAME: databricks-agent-mcp
  FOUNDRY_GENIE_AGENT_NAME: databricks-genie-agent
  FOUNDRY_MODEL_DEPLOYMENT_NAME: gpt-4.1
  MCP_CONNECTION_NAME: databricks-apim-mcp
  MCP_SERVER_URL: https://caldova-apim-westus.azure-api.net/databricks-mcp/mcp
  GENIE_MCP_CONNECTION_NAME: databricks-apim-genie-mcp
  GENIE_MCP_SERVER_URL: https://caldova-apim-westus.azure-api.net/databricks-genie-mcp/mcp
  APIM_SUBSCRIPTION_KEY: ${{ secrets.APIM_SUBSCRIPTION_KEY }}

jobs:
  provision-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "old mcaps/foundry/requirements.txt"

      - name: Install Foundry SDK
        run: python -m pip install --requirement "old mcaps/foundry/requirements.txt"

      - name: Create or update the Databricks SQL agent
        working-directory: "old mcaps/foundry"
        run: >-
          python provision_agent.py --output-dir ../../artifacts
          ${{ (github.event_name == 'workflow_dispatch' && !inputs.run_smoke_test) && '--skip-test' || '' }}

      - name: Create or update the Databricks Genie agent
        working-directory: "old mcaps/foundry"
        run: >-
          python provision_genie_agent.py --output-dir ../../artifacts
          ${{ (github.event_name == 'workflow_dispatch' && !inputs.run_smoke_test) && '--skip-test' || '' }}

      - name: Upload generated PowerPoint
        if: ${{ inputs.run_smoke_test }}
        uses: actions/upload-artifact@v4
        with:
          name: databricks-agent-pptx-smoke-test
          path: artifacts/*.pptx
          if-no-files-found: error
          retention-days: 7