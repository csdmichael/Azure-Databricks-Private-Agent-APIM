name: Provision Foundry Databricks Agents

on:
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: "Query Databricks and generate a PowerPoint smoke-test artifact"
        type: boolean
        default: true

# Archived component. Manual dispatch only - the push trigger was removed when
# foundry moved under "old mcaps".

permissions:
  id-token: write
  contents: read

concurrency:
  group: provision-foundry-databricks-agent
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  DEPLOYMENT_CONFIG_PATH: config/deployment.json
  APIM_SUBSCRIPTION_KEY: ${{ secrets.APIM_SUBSCRIPTION_KEY }}

jobs:
  provision-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deployment configuration
        shell: bash
        run: |
          foundry_account=$(jq -r '.foundry.application.accountName' "$DEPLOYMENT_CONFIG_PATH")
          foundry_project=$(jq -r '.foundry.application.projectName' "$DEPLOYMENT_CONFIG_PATH")
          gateway=$(jq -r '.apim.gatewayUrl' "$DEPLOYMENT_CONFIG_PATH")
          {
            echo "DEPLOYMENT_CONFIG_PATH=$GITHUB_WORKSPACE/$DEPLOYMENT_CONFIG_PATH"
            echo "AZURE_RESOURCE_GROUP=$(jq -r '.azure.resourceGroup' "$DEPLOYMENT_CONFIG_PATH")"
            echo "FOUNDRY_ACCOUNT_NAME=$foundry_account"
            echo "FOUNDRY_PROJECT_NAME=$foundry_project"
            echo "FOUNDRY_PROJECT_ENDPOINT=https://${foundry_account}.services.ai.azure.com/api/projects/${foundry_project}"
            echo "FOUNDRY_AGENT_NAME=$(jq -r '.api.agents.sqlFoundryName' "$DEPLOYMENT_CONFIG_PATH")"
            echo "FOUNDRY_GENIE_AGENT_NAME=$(jq -r '.api.agents.genieFoundryName' "$DEPLOYMENT_CONFIG_PATH")"
            echo "FOUNDRY_MODEL_DEPLOYMENT_NAME=$(jq -r '.foundry.application.modelDeploymentName' "$DEPLOYMENT_CONFIG_PATH")"
            echo "MCP_CONNECTION_NAME=$(jq -r '.foundry.application.sqlConnectionName' "$DEPLOYMENT_CONFIG_PATH")"
            echo "MCP_SERVER_URL=${gateway}/$(jq -r '.apim.mcpPath' "$DEPLOYMENT_CONFIG_PATH")/mcp"
            echo "GENIE_MCP_CONNECTION_NAME=$(jq -r '.foundry.application.genieConnectionName' "$DEPLOYMENT_CONFIG_PATH")"
            echo "GENIE_MCP_SERVER_URL=${gateway}/$(jq -r '.apim.genieMcpPath' "$DEPLOYMENT_CONFIG_PATH")/mcp"
            echo "DATABRICKS_CATALOG=$(jq -r '.databricks.catalog' "$DEPLOYMENT_CONFIG_PATH")"
            echo "DATABRICKS_SCHEMA=$(jq -r '.databricks.schema' "$DEPLOYMENT_CONFIG_PATH")"
          } >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "old mcaps/foundry/requirements.txt"

      - name: Install Foundry SDK
        run: python -m pip install --requirement "old mcaps/foundry/requirements.txt"

      - name: Create or update the Databricks SQL agent
        working-directory: "old mcaps/foundry"
        run: >-
          python provision_agent.py --output-dir ../../artifacts
          ${{ (github.event_name == 'workflow_dispatch' && !inputs.run_smoke_test) && '--skip-test' || '' }}

      - name: Create or update the Databricks Genie agent
        working-directory: "old mcaps/foundry"
        run: >-
          python provision_genie_agent.py --output-dir ../../artifacts
          ${{ (github.event_name == 'workflow_dispatch' && !inputs.run_smoke_test) && '--skip-test' || '' }}

      - name: Upload generated PowerPoint
        if: ${{ inputs.run_smoke_test }}
        uses: actions/upload-artifact@v4
        with:
          name: databricks-agent-pptx-smoke-test
          path: artifacts/*.pptx
          if-no-files-found: error
          retention-days: 7