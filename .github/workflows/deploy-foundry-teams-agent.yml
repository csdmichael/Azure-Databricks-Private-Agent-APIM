name: Deploy Foundry Teams OBO Agent

on:
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: Provision or update Bot Service, App Service, monitoring, and the APIM OBO MCP facade
        type: boolean
        default: true
      run_delegated_smoke_test:
        description: Run an agent data test with the short-lived delegated token secret
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-foundry-teams-obo
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: m365-myaacoub
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  FOUNDRY_ACCOUNT_NAME: foundry-myaacoub-private
  FOUNDRY_PROJECT_NAME: sales-poc
  FOUNDRY_PROJECT_ENDPOINT: https://foundry-myaacoub-private.services.ai.azure.com/api/projects/sales-poc
  FOUNDRY_AGENT_NAME: semiconductor-sales-genie
  FOUNDRY_MODEL_DEPLOYMENT_NAME: gpt-6-astra
  FOUNDRY_AGENT_PORTAL_URL: https://ai.azure.com/nextgen/r/z4JFcKi6SXqhhApS8YMKqQ,m365-myaacoub,,foundry-myaacoub-private,sales-poc/build/agents/semiconductor-sales-genie/build?tid=12a4b86b-e64c-43f9-af05-d9130a72dfd2
  MCP_SERVER_URL: https://caldova-apim-westus.azure-api.net/databricks-genie-obo-mcp/mcp
  MCP_CONNECTION_ID: databricks-genie-obo-user
  BOT_NAME: caldova-foundry-databricks-bot
  BOT_APP_NAME: caldova-foundry-databricks-bot
  OAUTH_CONNECTION_NAME: DatabricksGenieOBO

jobs:
  build-and-provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: foundry/teams-bot/package-lock.json

      - name: Build and test Teams bridge
        working-directory: foundry/teams-bot
        run: |
          npm ci
          npm test
          npm run build
          TEAMS_APP_ID="${{ secrets.TEAMS_BOT_CLIENT_ID }}" \
          BOT_ID="${{ secrets.TEAMS_BOT_CLIENT_ID }}" \
          BOT_HOST_NAME="${BOT_APP_NAME}.azurewebsites.net" \
          npm run package:teams

      - name: Create App Service deployment package
        working-directory: foundry/teams-bot
        run: zip -r ../../foundry-teams-bot.zip dist package.json package-lock.json

      - name: Azure login with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure resources with Bicep
        if: ${{ inputs.deploy_infrastructure }}
        env:
          TEAMS_BOT_CLIENT_SECRET: ${{ secrets.TEAMS_BOT_CLIENT_SECRET }}
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file foundry/infra/bicep/main.bicep \
            --parameters \
              location=westus2 \
              foundryAccountName="$FOUNDRY_ACCOUNT_NAME" \
              foundryProjectName="$FOUNDRY_PROJECT_NAME" \
              apimName=caldova-apim-westus \
              tenantId="$AZURE_TENANT_ID" \
              botClientId="${{ secrets.TEAMS_BOT_CLIENT_ID }}" \
              botClientSecret="$TEAMS_BOT_CLIENT_SECRET" \
              botName="$BOT_NAME" \
              botAppName="$BOT_APP_NAME" \
              appServicePlanName=caldova-tokenomics-api-plan \
              oauthConnectionName="$OAUTH_CONNECTION_NAME" \
              delegatedScope="https://ai.azure.com/.default" \
              foundryAgentName="$FOUNDRY_AGENT_NAME"

      - name: Deploy Teams bridge
        run: >-
          az webapp deploy
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$BOT_APP_NAME"
          --src-path foundry-teams-bot.zip
          --type zip
          --clean true
          --restart true

      - name: Verify bot health
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent "https://${BOT_APP_NAME}.azurewebsites.net/health"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Upload Teams package
        uses: actions/upload-artifact@v4
        with:
          name: foundry-databricks-teams-package
          path: foundry/Teams Package/Foundry-Databricks-Agent.zip
          if-no-files-found: error

  publish-foundry-agent:
    needs: build-and-provision
    runs-on: [self-hosted, Windows, foundry-private]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foundry/agent/requirements.txt

      - name: Azure login with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Foundry SDK
        run: python -m pip install --requirement foundry/agent/requirements.txt

      - name: Publish agent version
        shell: pwsh
        env:
          DELEGATED_SMOKE_TEST_TOKEN: ${{ secrets.DELEGATED_SMOKE_TEST_TOKEN }}
        run: |
          $arguments = @('foundry/agent/provision_agent.py')
          if ('${{ inputs.run_delegated_smoke_test }}' -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:DELEGATED_SMOKE_TEST_TOKEN)) {
              throw 'DELEGATED_SMOKE_TEST_TOKEN is required when run_delegated_smoke_test is enabled.'
            }
            $arguments += @('--test-token', $env:DELEGATED_SMOKE_TEST_TOKEN)
          }
          python @arguments
