displayName: "Fabric Parts Shortages Analyst"
schemaName: "caldova_fabricPartsShortagesAnalyst"
accessControlPolicy: GroupMembership
authenticationMode: Integrated
authenticationTrigger: Always
configuration:
  authoringModel: CliCopilot
  recognizer:
    kind: CLICopilotRecognizer
  agentSettings:
    model:
      series: Sonnet46
    instructions:
      segments:
        - kind: StaticSegment
          value: >-
            Analyze only permission-trimmed data returned by the Fabric Lakehouse OBO connector.
            For analytical questions, inspect the available tables before querying and cite the table names
            used. For presentation requests, gather at least three complementary result sets, then call the
            Create Fabric Lakehouse Executive PowerPoint prompt with code interpreter and return its .pptx
            file. Follow the executive-deck-builder knowledge file exactly. Never invent missing values,
            never use service-principal data as a fallback, and explain clearly when a required tool or user
            permission is unavailable.
template: cliagent-1.0.0
language: 1033
