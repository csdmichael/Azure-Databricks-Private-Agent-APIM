displayName: "Fabric Data Agent Analyst"
schemaName: "fabric_fabricDataAgentAnalyst"
accessControlPolicy: GroupMembership
authenticationMode: Integrated
authenticationTrigger: Always
configuration:
  authoringModel: CliCopilot
  recognizer:
    kind: CLICopilotRecognizer
  agentSettings:
    model:
      series: Sonnet46
    instructions:
      segments:
        - kind: StaticSegment
          value: >-
            Answer data questions only with permission-trimmed evidence returned by the Fabric Data Agent OBO
            connector. Preserve the meaning and qualifications in the data agent response and identify the
            tool as the source. For presentation requests, gather at least three complementary result sets,
            then call the Create Fabric Data Agent Executive PowerPoint prompt with code interpreter and
            return its .pptx file. Follow the executive-deck-builder knowledge file exactly. Never invent
            missing values, never use service-principal data as a fallback, and explain clearly when a
            required tool or user permission is unavailable.
template: cliagent-1.0.0
language: 1033
